  <style>
    :root {
      --bg1: #fff3d7;
      --bg2: #f3dcae;
      --ink: #143f42;
      --deep: #073f3e;
      --cream: #fff4d7;
      --gold: #e6aa28;
      --brown: #7a4b12;
      --shadow: rgba(43, 27, 8, .24);
      --phone-w: min(94vw, 440px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 8%, rgba(255,255,255,.55), transparent 26%),
        radial-gradient(circle at 82% 12%, rgba(255,205,75,.24), transparent 28%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      -webkit-text-size-adjust: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(45deg, rgba(91, 55, 14, .08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(91, 55, 14, .08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(91, 55, 14, .08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(91, 55, 14, .08) 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
    }

    .app {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) 8px max(24px, env(safe-area-inset-bottom));
    }

    .screen {
      width: var(--phone-w);
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .visual {
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255, 246, 223, .62);
      box-shadow: 0 14px 18px var(--shadow);
      border: 1px solid rgba(150, 95, 19, .16);
    }

    .visual img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .question-visual {
      border-radius: 20px;
      background: transparent;
      box-shadow: 0 10px 14px rgba(43,27,8,.18);
    }

    .actions,
    .choice-stack,
    .nav-row {
      width: 100%;
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    .nav-row {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .nav-row.single {
      grid-template-columns: 1fr;
    }

    .image-button {
      appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      width: 100%;
      max-width: 420px;
      line-height: 0;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .image-button img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 8px rgba(34, 23, 8, .16));
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .image-button:active,
    .choice-button:active,
    .nav-button:active {
      transform: translateY(2px) scale(.992);
      filter: brightness(.98);
    }

    .choice-stack {
      gap: 10px;
    }

    .choice-button {
      position: relative;
      width: 100%;
      max-width: 430px;
      aspect-ratio: 5.4 / 1;
      appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: pointer;
      overflow: visible;
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .choice-button[disabled] {
      cursor: default;
    }

    .choice-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 5px 6px rgba(43, 27, 8, .16));
    }

    /* 可読性優先版：
       白文字＋太い縁取りはスマホで潰れるため廃止。
       ボタンの上に薄いクリーム色の読み取り帯を置き、濃い文字で表示。 */
    .choice-label {
      position: absolute;
      left: 102px;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      min-height: 58%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 249, 229, .90);
      color: #073f3e;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: .01em;
      font-size: clamp(16px, 4.15vw, 20px);
      text-shadow: 0 1px 0 rgba(255,255,255,.75);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 2px 5px rgba(45, 28, 8, .12);
      pointer-events: none;
    }

    .choice-label.long {
      font-size: clamp(14.2px, 3.55vw, 17px);
      line-height: 1.16;
      padding-left: 10px;
      padding-right: 10px;
    }

    .choice-label.xlong {
      font-size: clamp(12.4px, 3.08vw, 15px);
      line-height: 1.12;
      padding-left: 8px;
      padding-right: 8px;
    }

    .nav-button {
      appearance: none;
      width: 100%;
      border: 2px solid rgba(145, 89, 15, .55);
      border-radius: 999px;
      padding: 12px 14px;
      background: linear-gradient(180deg, #fff7e8, #efd5a0);
      color: var(--deep);
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow:
        0 7px 11px rgba(80, 53, 14, .15),
        inset 0 1px 0 rgba(255,255,255,.9);
      -webkit-tap-highlight-color: transparent;
    }

    .tiny-note {
      width: 100%;
      margin: 0;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(255,247,229,.9);
      border: 1px solid rgba(173,120,31,.25);
      color: #5c4118;
      text-align: center;
      line-height: 1.55;
      font-size: 13px;
      box-shadow: 0 8px 12px rgba(80,53,14,.08);
    }


    .sound-toggle {
      position: fixed;
      right: max(10px, env(safe-area-inset-right));
      top: max(10px, env(safe-area-inset-top));
      z-index: 9998;
      appearance: none;
      border: 2px solid rgba(122, 75, 18, .55);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 247, 229, .92);
      color: var(--deep);
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 6px 12px rgba(43, 27, 8, .18);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .sound-toggle:active {
      transform: translateY(1px);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      max-width: min(92vw, 360px);
      padding: 12px 16px;
      border-radius: 999px;
      color: #fff9e8;
      background: rgba(18, 64, 63, .96);
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      white-space: pre-line;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

        ]

          { key: "d", text: "複数のAIツールを<br>目的別に使い分けている", score: 3, long: "xlong" }

        ]
      },
      {

          { key: "a", text: "AIを怖がらずに<br>使えるようになりたい", score: 0, long: "long" },
          { key: "b", text: "安心して、日常や仕事で<br>使えるようになりたい", score: 1, long: "xlong" },
          { key: "c", text: "仕事の効率を上げて、<br>発信や制作に活かしたい", score: 2, long: "xlong" },
          { key: "d", text: "AIで収益化・事業化・<br>仕組み化まで進みたい", score: 3, long: "xlong" }
        ]
      }
    ];

    const results = [
      { min: 0, max: 4, level: 0, name: "AIこわごわスタートさん", resultImage: "result_lv0_ai_kowagowa_start.png", shareCard: "share_card_lv0_ai_kowagowa_start.png" },
      { min: 5, max: 8, level: 1, name: "安全第一ビギナーさん", resultImage: "result_lv1_anzen_daiichi_beginner.png", shareCard: "share_card_lv1_anzen_daiichi_beginner.png" },
      { min: 9, max: 12, level: 2, name: "ChatGPT相談上手さん", resultImage: "result_lv2_chatgpt_sodan_jozu.png", shareCard: "share_card_lv2_chatgpt_sodan_jozu.png" },
      { min: 13, max: 17, level: 3, name: "AI使い分け探検家さん", resultImage: "result_lv3_ai_tsukaiwake_tankenka.png", shareCard: "share_card_lv3_ai_tsukaiwake_tankenka.png" },
      { min: 18, max: 21, level: 4, name: "AI実装クリエイターさん", resultImage: "result_lv4_ai_jisso_creator.png", shareCard: "share_card_lv4_ai_jisso_creator.png" },
      { min: 22, max: 26, level: 5, name: "自動化・AIエージェント研究家さん", resultImage: "result_lv5_jidoka_ai_agent_kenkyuka.png", shareCard: "share_card_lv5_jidoka_ai_agent_kenkyuka.png" },
      { min: 27, max: 30, level: 6, name: "AI事業プロデューサーさん", resultImage: "result_lv6_ai_jigyo_producer.png", shareCard: "share_card_lv6_ai_jigyo_producer.png" }
    ];

    function imgTag(file, alt = "") {
      return `<img src="${IMG}${file}" alt="${alt}">`;
    }

    function imageButton(file, alt, onclick) {
      return `
        <button class="image-button" type="button" onclick="${onclick}">
          <img src="${IMG}${file}" alt="${alt}">
        </button>
      `;
    }

    function showStart() {
      playBgm("start");
      currentQuestion = 0;
      totalScore = 0;
      selectedScores = [];
      latestResult = null;
      locked = false;

      app.innerHTML = `
        <section class="visual main-visual">
          ${imgTag("title_main_clean.png", "BT式！AI活用レベル診断")}
        </section>
        <div class="actions">
          ${imageButton("button_start.png", "診断スタート", "showGuide()")}
        </div>
      `;
    }

    function showGuide() {
      playBgm("start");
      app.innerHTML = `
        <section class="visual main-visual">
          ${imgTag("guide_intro_clean.png", "診断のながれ")}
        </section>
        <div class="nav-row">
          <button class="nav-button" type="button" onclick="showStart()">← 戻る</button>
          <button class="nav-button" type="button" onclick="showQuestion()">次へ →</button>
        </div>
      `;
    }

    function showQuestion() {
      playBgm("start");
      locked = false;
      const q = questions[currentQuestion];

      const choices = q.answers.map(ans => `
        <button class="choice-button" type="button" data-key="${ans.key}" onclick="selectAnswer('${ans.key}', ${ans.score})">
          <img class="choice-bg" src="${IMG}choice_${ans.key}_default.png" alt="">
          <span class="choice-label ${ans.long || ""}">${ans.text}</span>
        </button>
      `).join("");

      app.innerHTML = `
        <section class="visual question-visual">
          ${imgTag(q.image, `質問 ${currentQuestion + 1}`)}
        </section>
        <div class="choice-stack">
          ${choices}
        </div>
        <div class="nav-row single">
          <button class="nav-button" type="button" onclick="goBackFromQuestion()">← 戻る</button>
        </div>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectAnswer(key, score) {
      if (locked) return;
      locked = true;

      selectedScores[currentQuestion] = score;
      totalScore += score;
      playSe("select");

      document.querySelectorAll(".choice-button").forEach(btn => {
        btn.disabled = true;
        const btnKey = btn.dataset.key;
        const bg = btn.querySelector(".choice-bg");
        if (btnKey === key) {
          bg.src = `${IMG}choice_${btnKey}_selected.png`;
          btn.style.filter = "brightness(1.08)";
        } else {
          btn.style.opacity = ".78";
        }
      });

      setTimeout(() => {
        currentQuestion += 1;
        if (currentQuestion >= questions.length) {
          showLoading();
        } else {
          showQuestion();
        }
      }, 420);
    }

    function goBackFromQuestion() {
      if (locked) return;

      if (currentQuestion === 0) {
        showGuide();
        return;
      }

      currentQuestion -= 1;
      const prevScore = selectedScores[currentQuestion] || 0;
      totalScore -= prevScore;
      selectedScores[currentQuestion] = undefined;
      showQuestion();
    }

    function showLoading() {
      app.innerHTML = `
        <section class="visual loading-visual">
          ${imgTag("loading.png", "診断中")}
        </section>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
      setTimeout(showResult, 900);
    }

    function getResult(score) {
      return results.find(r => score >= r.min && score <= r.max) || results[0];
    }

    function showResult() {
      playBgm("result");
      latestResult = getResult(totalScore);

      app.innerHTML = `
        <section class="visual result-visual">
          ${imgTag(latestResult.resultImage, `診断結果 Lv.${latestResult.level} ${latestResult.name}`)}
        </section>
        <div class="actions">
          ${imageButton("button_save_card.png", "結果画像を保存", "downloadShareCard()")}
          ${imageButton("button_copy_share_text.png", "シェア文をコピー", "copyShareText()")}
          ${imageButton("button_retry.png", "もう一度診断", "showStart()")}
        </div>
        <p class="tiny-note">
          保存したトレカ画像をフォローLINEグループに投稿してみよう！<br>
          スマホで保存できない場合は、画像を長押しして保存してください。
        </p>
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function downloadShareCard() {
      if (!latestResult) return;
      const link = document.createElement("a");
      link.href = `${IMG}${latestResult.shareCard}`;
      link.download = latestResult.shareCard;
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast("結果画像を保存してね！");
    }

    async function copyShareText() {
      if (!latestResult) return;
      const text = `BT式！AI活用レベル診断をやってみたら、【Lv.${latestResult.level} ${latestResult.name}】でした！\n自分の今のAI活用レベルが見えて面白かったです😊\nみんなもやってみてね✨`;

      try {
        await navigator.clipboard.writeText(text);
        showToast("シェア文をコピーしました！");
      } catch (error) {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand("copy");
        showToast("シェア文をコピーしました！");
      } catch (e) {
        showToast("コピーできませんでした");
      }
      textarea.remove();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }


    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundToggle");
      btn.textContent = soundEnabled ? "♪ ON" : "♪ OFF";

      if (soundEnabled) {
        if (currentQuestion === 0 && !latestResult) {
          playBgm("start");
        } else if (latestResult) {
          playBgm("result");
        } else {
          playBgm("start");
        }
        showToast("BGMをONにしました");
      } else {
        stopAllAudio();
        showToast("BGMをOFFにしました");
      }
    }

    function safePlay(audio) {
      if (!soundEnabled || !audio) return;
      try {
        audio.currentTime = audio.loop ? audio.currentTime : 0;
        const promise = audio.play();
        if (promise && typeof promise.catch === "function") {
          promise.catch(() => {
            // ブラウザの自動再生制限やファイル未配置の場合は無視
          });
        }
      } catch (e) {
        // 音声ファイルがない場合もゲームは続行
      }
    }

    function stopAudio(audio) {
      if (!audio) return;
      try {
        audio.pause();
        audio.currentTime = 0;
      } catch (e) {}
    }

    function stopAllAudio() {
      Object.values(audioFiles).forEach(stopAudio);
      currentBgm = null;
    }

    function playBgm(name) {
      if (!soundEnabled) return;
      const next = audioFiles[name];
      if (!next) return;

      // 結果BGMはループせず、結果画面に入るたびに最初から1回だけ鳴らす
      if (name === "result") {
        if (currentBgm && currentBgm !== next) {
          try {
            currentBgm.pause();
            currentBgm.currentTime = 0;
          } catch (e) {}
        }
        currentBgm = next;
        currentBgm.loop = false;
        currentBgm.volume = 0.42;
        try { currentBgm.currentTime = 0; } catch (e) {}
        safePlay(currentBgm);
        return;
      }

      if (currentBgm === next) return;

      if (currentBgm) {
        try {
          currentBgm.pause();
          currentBgm.currentTime = 0;
        } catch (e) {}
      }

      currentBgm = next;
      currentBgm.volume = 0.38;
      safePlay(currentBgm);
    }

    function playSe(name) {
      if (!soundEnabled) return;
      const se = audioFiles[name];
      if (!se) return;
      safePlay(se);
    }

    function preload() {
      const imageNames = [
        "title_main_clean.png",
        "guide_intro_clean.png",
        "loading.png",
        "button_start.png",
        "button_next.png",
        "button_retry.png",
        "button_save_card.png",
        "button_copy_share_text.png",
        ...questions.map(q => q.image),
        ...["a", "b", "c", "d"].flatMap(k => [`choice_${k}_default.png`, `choice_${k}_selected.png`]),
        ...results.flatMap(r => [r.resultImage, r.shareCard]),
        "share_after_save.png",
        "share_copy_text_template.png",
        "share_guide_line_group.png"
      ];

      imageNames.forEach(name => {
        const img = new Image();
        img.src = IMG + name;
      });
    }

    preload();
    showStart();
  </script>
</body>
</html>
